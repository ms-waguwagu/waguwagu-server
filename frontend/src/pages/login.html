<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAGUWAGU Login</title>

    <!-- 기존 스타일 -->
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/ranking.css" />
    <link rel="icon" href="src/images/pacmanfav.png" type="image/png">

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- 닉네임 카드 기본 숨김 -->
    <style>
      #app {
        display: none;
      }
    </style>
  </head>

  <body class="mode-main">
    <!-- 좌(랭킹) + 우(히어로) 레이아웃 -->
    <div id="layout">
      <aside id="ranking-panel">
        <h2>WEEKLY TOP 10</h2>
        <div id="ranking-list">
          <div class="empty-ranking">로딩 중...</div>
          <!-- JS로 .ranking-item 10개를 넣는 구조 -->
        </div>
      </aside>

      <main id="main-screen">
        <!-- 배경 + 중앙정렬 기준 히어로 -->
        <section id="hero">
          <div id="center-area">
            <div id="game-title" data-text="WAGUWAGU">WAGUWAGU</div> 

            <!-- 구글 로그인 버튼 영역 -->
            <div id="google-login-area"></div>

            <!-- OAuth 이후 신규 유저만 쓰는 닉네임 카드 -->
            <div id="app">
              <input
                type="text"
                id="nickname-input"
                placeholder="닉네임을 입력해주세요"
              />
              <button id="start-button">준비 완료</button>
              <p id="status-message"></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- 🔥 로그인 로직 -->
    <script type="module">
      import { googleLogin } from "../api/google-login-api.js";
      import { MATCHING_CONFIG } from "../../config.js";

      //이미 로그인 한 사용자라면, home으로 리다이렉션
      const token = localStorage.getItem("accessToken");
      if (token) {
        location.href = "./home.html";
      }

      window.onload = () => {
        google.accounts.id.initialize({
          client_id: MATCHING_CONFIG.GOOGLE_CLIENT_ID,
          callback: async (response) => {
            try {
              const data = await googleLogin(response.credential);

              localStorage.setItem("accessToken", data.accessToken);
              localStorage.setItem("googlesub", data.googleSub);

              if (data.isNewUser) {
                // 신규 유저 → 닉네임 입력 UI 활성화
                document.getElementById("app").style.display = "block";
                document.getElementById("google-login-area").style.display =
                  "none";
              } else {
                // 기존 유저 → 바로 홈으로 (닉네임 확인용)
                location.href = "./home.html";
              }
            } catch (e) {
              alert(e.message);
            }
          },
        });

        google.accounts.id.renderButton(
          document.getElementById("google-login-area"),
          {
            theme: "filled_black",
            size: "large",
            shape: "rectangular", 
            width: "300",          
            logo_alignment: "center"
          }
        );
      };
    </script>

    <!-- 기존 닉네임/게임 시작 로직 -->
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
